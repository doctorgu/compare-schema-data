- name: read_schema_different_reference
  value: |
    SELECT  a.env_name, a.db_name, a.table_name, a.constraint_name,
            a.column_name column_name_a,
            b.column_name column_name_b,
            a.referenced_table_name referenced_table_name_a,
            b.referenced_table_name referenced_table_name_b,
            a.referenced_column_name referenced_column_name_a,
            b.referenced_column_name referenced_column_name_b
    FROM    schema_references a
            INNER JOIN schema_references b
            ON
    #if ${other_version}
            b.version = :other_version
    #else
            a.version = b.version
    #endif
            AND b.env_name = :other_env_name
            AND b.db_name = :other_db_name
            AND a.table_name = b.table_name
            AND a.constraint_name = b.constraint_name
    WHERE   a.version = :current_version
            AND a.env_name = :current_env_name
            AND a.db_name = :current_db_name
            AND
            (
                1 != 1
                OR a.column_name != b.column_name
                OR a.referenced_table_name != b.referenced_table_name
                OR a.referenced_column_name != b.referenced_column_name
            )

- name: read_not_same_schema
  value: |
    WITH n_tbl AS (
        SELECT  env_name, db_name, table_name, table_comment
        FROM    schema_tables
        WHERE   VERSION = :version
                AND table_type = 'BASE TABLE'
    )
    , o_tbl AS (
        SELECT  env_name, db_name, table_name, table_comment
        FROM    schema_tables
        WHERE   VERSION = :prev_version
                AND table_type = 'BASE TABLE'
    )
    , n_vw AS (
        SELECT  env_name, db_name, table_name, table_comment
        FROM    schema_tables
        WHERE   VERSION = :version
                AND table_type = 'VIEW'
    )
    , o_vw AS (
        SELECT  env_name, db_name, table_name, table_comment
        FROM    schema_tables
        WHERE   VERSION = :prev_version
                AND table_type = 'VIEW'
    )
    , n_col AS (
        SELECT  version, env_name, db_name, table_name, column_name,
                ordinal_position, column_default, is_nullable, data_type,
                character_maximum_length, numeric_precision,
                numeric_scale, column_comment
        FROM    schema_columns
        WHERE   VERSION = :version
    )
    , o_col AS (
        SELECT  version, env_name, db_name, table_name, column_name,
                ordinal_position, column_default, is_nullable, data_type,
                character_maximum_length, numeric_precision,
                numeric_scale, column_comment
        FROM    schema_columns
        WHERE   VERSION = :prev_version
    )
    , n_idx AS (
        SELECT  env_name, db_name, table_name, index_name,
                column_name_comma, index_type, is_unique
        FROM    schema_indices
        WHERE   VERSION = :version
    )
    , o_idx AS (
        SELECT  env_name, db_name, table_name, index_name,
                column_name_comma, index_type, is_unique
        FROM    schema_indices
        WHERE   VERSION = :prev_version
    )
    , n_ref AS (
        SELECT  env_name, db_name, constraint_name,
                table_name, column_name, referenced_table_name,
                referenced_column_name
        FROM    schema_references
        WHERE   VERSION = :version
    )
    , o_ref AS (
        SELECT  env_name, db_name, constraint_name,
                table_name, column_name, referenced_table_name,
                referenced_column_name
        FROM    schema_references
        WHERE   VERSION = :prev_version
    )
    , cnt AS (
        SELECT  'table' compare_type,
                (
                    SELECT  count(*) cnt_n
                    FROM    n_tbl
                ) n,
                (
                    SELECT  count(*) cnt_o
                    FROM    o_tbl
                ) o,
                (
                    SELECT  count(*) cnt_n_o
                    FROM    n_tbl n
                            INNER JOIN o_tbl o
                            ON o.env_name = n.env_name
                            AND o.db_name = n.db_name
                            AND o.table_name = n.table_name
                            AND o.table_comment = n.table_comment
                ) n_o
        UNION ALL
        SELECT  'view' compare_type,
                (
                    SELECT  count(*) cnt_n
                    FROM    n_vw
                ) n,
                (
                    SELECT  count(*) cnt_o
                    FROM    o_vw
                ) o,
                (
                    SELECT  count(*) cnt_n_o
                    FROM    n_vw n
                            INNER JOIN o_vw o
                            ON o.env_name = n.env_name
                            AND o.db_name = n.db_name
                            AND o.table_name = n.table_name
                            AND o.table_comment = n.table_comment
                ) n_o
        UNION ALL
        SELECT  'column' compare_type,
                (
                    SELECT  count(*) cnt_n
                    FROM    n_col
                ) n,
                (
                    SELECT  count(*) cnt_o
                    FROM    o_col
                ) o,
                (
                    SELECT  count(*) cnt_n_o
                    FROM    n_col n
                            INNER JOIN o_col o
                            ON o.env_name = n.env_name
                            AND o.db_name = n.db_name
                            AND o.table_name = n.table_name
                            AND o.column_name = n.column_name
                            AND o.ordinal_position = n.ordinal_position
                            AND COALESCE(o.column_default, '{NULL}') 
                                = COALESCE(n.column_default, '{NULL}')
                            AND o.is_nullable = n.is_nullable
                            AND o.data_type = n.data_type
                            AND COALESCE(o.character_maximum_length, 0) 
                                = COALESCE(n.character_maximum_length, 0)
                            AND COALESCE(o.numeric_precision, -1) 
                                = COALESCE(n.numeric_precision, -1)
                            AND COALESCE(o.numeric_scale, -1) 
                                = COALESCE(n.numeric_scale, -1)
                            AND o.column_comment = n.column_comment
                ) n_o
        UNION ALL
        SELECT  'index' compare_type,
                (
                    SELECT  count(*) cnt_n
                    FROM    n_idx
                ) n,
                (
                    SELECT  count(*) cnt_o
                    FROM    o_idx
                ) o,
                (
                    SELECT  count(*) cnt_n_o
                    FROM    n_idx n
                            INNER JOIN o_idx o
                            ON o.env_name = n.env_name
                            AND o.db_name = n.db_name
                            AND o.table_name = n.table_name
                            AND o.index_name = n.index_name
                            AND o.column_name_comma = n.column_name_comma
                            AND o.index_type = n.index_type
                            AND o.is_unique = n.is_unique
                ) n_o
        UNION ALL
        SELECT  'reference' compare_type,
                (
                    SELECT  count(*) cnt_n
                    FROM    n_ref
                ) n,
                (
                    SELECT  count(*) cnt_o
                    FROM    o_ref
                ) o,
                (
                    SELECT  count(*) cnt_n_o
                    FROM    n_ref n
                            INNER JOIN o_ref o
                            ON o.env_name = n.env_name
                            AND o.db_name = n.db_name
                            AND o.constraint_name = n.constraint_name
                            AND o.table_name = n.table_name
                            AND o.column_name = n.column_name
                            AND o.referenced_table_name = n.referenced_table_name
                            AND o.referenced_column_name = n.referenced_column_name
                ) n_o
    )
    SELECT  compare_type
    FROM    cnt
    WHERE   n != o OR o != n_o
