- name: in_table_both_exists
  value: |
    AND (a.version, a.env_name, a.db_name, a.table_name) IN (
        SELECT  a.version, a.env_name, a.db_name, a.table_name
        FROM    schema_tables a
                INNER JOIN schema_tables b
                ON a.version = b.version
                AND a.table_name = b.table_name
        WHERE   a.version = :current_version
                AND a.env_name = :current_env_name
                AND b.env_name = :other_env_name
                AND a.db_name = :current_db_name
                AND b.db_name = :other_db_name
    )

- name: read_latest_version
  value: |
    SELECT  MAX(version) version
    FROM    schema_tables;

- name: read_prev_version
  value: |
    SELECT  MAX(version) version
    FROM    schema_tables
    WHERE   version < :version;

- name: delete_schema_by_version
  value: |
    DELETE
    FROM    schema_tables
    WHERE   version = :version;

    DELETE
    FROM    schema_columns
    WHERE   version = :version;

    DELETE
    FROM    schema_indices
    WHERE   version = :version;

    DELETE
    FROM    schema_references
    WHERE   version = :version;

- name: insert_tables_from_mysql
  value: |
    INSERT INTO schema_tables
        (
            version, env_name, db_name,
            table_name, table_type, table_comment
        )
    VALUES
        (
            :version, :env_name, :db_name,
            :table_name, :table_type, :table_comment
        )

- name: insert_columns_from_mysql
  value: |
    INSERT INTO schema_columns
        (
            version, env_name, db_name,
            table_name,
            column_name,
            ordinal_position,
            column_default,
            is_nullable,
            data_type,
            character_maximum_length,
            numeric_precision,
            numeric_scale,
            column_type,
            column_comment
        )
    VALUES
        (
            :version, :env_name, :db_name,
            :table_name,
            :column_name,
            :ordinal_position,
            :column_default,
            :is_nullable,
            :data_type,
            :character_maximum_length,
            :numeric_precision,
            :numeric_scale,
            :column_type,
            :column_comment
        )

- name: insert_indices_from_mysql
  value: |
    INSERT INTO schema_indices
        (
            version, env_name, db_name,
            table_name,
            index_name,
            column_name_comma,
            index_type, is_unique
        )
    VALUES
        (
            :version, :env_name, :db_name,
            :table_name,
            :index_name,
            :column_name_comma,
            :index_type, :is_unique
        )

- name: insert_references_from_mysql
  value: |
    INSERT INTO schema_references
        (
            version, env_name, db_name,
            constraint_name,
            table_name,
            column_name,
            referenced_table_name,
            referenced_column_name
        )
    VALUES
        (
            :version, :env_name, :db_name,
            :constraint_name,
            :table_name,
            :column_name,
            :referenced_table_name,
            :referenced_column_name
        )

- name: read_schema_not_exists_table
  value: |
    SELECT  a.env_name, a.db_name, a.table_name
    FROM    schema_tables a
            LEFT JOIN schema_tables b
            ON
    #if ${other_version}
            b.version = :other_version
    #else
            a.version = b.version
    #endif
            AND b.env_name = :other_env_name
            AND b.db_name = :other_db_name
            AND a.table_name = b.table_name
    WHERE   a.version = :current_version
            AND a.env_name = :current_env_name
            AND a.db_name = :current_db_name
            AND a.table_type = 'BASE TABLE'
            AND b.version IS NULL
    #if ${exclude_tables}
            AND a.table_name NOT IN
            #foreach t in ${exclude_tables} open="(" separator="," close=")"
                :t
            #endfor
    #endif

- name: read_schema_not_exists_view
  value: |
    SELECT  a.env_name, a.db_name, a.table_name view_name
    FROM    schema_tables a
            LEFT JOIN schema_tables b
            ON
    #if ${other_version}
            b.version = :other_version
    #else
            a.version = b.version
    #endif
            AND b.env_name = :other_env_name
            AND b.db_name = :other_db_name
            AND a.table_name = b.table_name
    WHERE   a.version = :current_version
            AND a.env_name = :current_env_name
            AND a.db_name = :current_db_name
            AND a.table_type = 'VIEW'
            AND b.version IS NULL

- name: read_schema_not_exists_column
  value: |
    SELECT  a.env_name, a.db_name, a.table_name, a.column_name,
            a.column_default, a.is_nullable, a.data_type,
            a.column_type, a.column_comment
    FROM    schema_columns a
            LEFT JOIN schema_columns b
            ON
    #if ${other_version}
            b.version = :other_version
    #else
            a.version = b.version
    #endif
            AND b.env_name = :other_env_name
            AND b.db_name = :other_db_name
            AND a.table_name = b.table_name
            AND a.column_name = b.column_name
    WHERE   a.version = :current_version
            AND a.env_name = :current_env_name
            AND a.db_name = :current_db_name
            AND b.version IS NULL        
            #include in_table_both_exists
    #if ${exclude_tables}
            AND a.table_name NOT IN
            #foreach t in ${exclude_tables} open="(" separator="," close=")"
                :t
            #endfor
    #endif
    #if ${exclude_columns}
            AND a.column_name NOT IN
            #foreach c in ${exclude_columns} open="(" separator="," close=")"
                :c
            #endfor
    #endif

