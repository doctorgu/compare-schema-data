- name: read_schema_different_table
  value: |
    SELECT  a.env_name, a.db_name, a.table_name,
            a.table_type table_type_a,
            b.table_type table_type_b,
            a.table_comment table_comment_a,
            b.table_comment table_comment_b
    FROM    schema_tables a
            INNER JOIN schema_tables b
            ON
    #if ${other_version}
            b.version = :other_version
    #else
            a.version = b.version
    #endif
            AND b.env_name = :other_env_name
            AND b.db_name = :other_db_name
            AND a.table_name = b.table_name
    WHERE   a.version = :current_version
            AND a.env_name = :current_env_name
            AND a.db_name = :current_db_name
            AND
            (
                1 != 1
                OR a.table_type != b.table_type
                OR COALESCE(a.table_comment, 'null') != COALESCE(b.table_comment, 'null')
            )
    #if ${exclude_tables}
            AND a.table_name NOT IN
            #foreach t in ${exclude_tables} open="(" separator="," close=")"
                :t
            #endfor
    #endif

- name: read_schema_different_column
  value: |
    SELECT  a.env_name, a.db_name, a.table_name, a.column_name,
            --a.ordinal_position ordinal_position_a,
            --b.ordinal_position ordinal_position_b,
            COALESCE(a.column_default, 'null') column_default_a,
            COALESCE(b.column_default, 'null') column_default_b,
            a.is_nullable is_nullable_a,
            b.is_nullable is_nullable_b,
            a.data_type data_type_a,
            b.data_type data_type_b,
            COALESCE(a.character_maximum_length, -1) character_maximum_length_a,
            COALESCE(b.character_maximum_length, -1) character_maximum_length_b,
            COALESCE(a.numeric_precision, -1) numeric_precision_a,
            COALESCE(b.numeric_precision, -1) numeric_precision_b,
            COALESCE(a.numeric_scale, -1) numeric_scale_a,
            COALESCE(b.numeric_scale, -1) numeric_scale_b,
            COALESCE(a.column_comment, 'null') column_comment_a,
            COALESCE(b.column_comment, 'null') column_comment_b
    FROM    schema_columns a
            INNER JOIN schema_columns b
            ON
    #if ${other_version}
            b.version = :other_version
    #else
            a.version = b.version
    #endif
            AND b.env_name = :other_env_name
            AND b.db_name = :other_db_name
            AND a.table_name = b.table_name
            AND a.column_name = b.column_name
    WHERE   a.version = :current_version
            AND a.env_name = :current_env_name
            AND a.db_name = :current_db_name
            AND
            (
                1 != 1
                -- OR a.ordinal_position != b.ordinal_position
                OR COALESCE(a.column_default, 'null') != COALESCE(b.column_default, 'null')
                OR a.is_nullable != b.is_nullable
                OR a.data_type != b.data_type
                OR COALESCE(a.character_maximum_length, -1)
                   != COALESCE(b.character_maximum_length, -1)
                OR COALESCE(a.numeric_precision, -1) != COALESCE(b.numeric_precision, -1)
                OR COALESCE(a.numeric_scale, -1) != COALESCE(b.numeric_scale, -1)
                OR COALESCE(a.column_comment, 'null') != COALESCE(b.column_comment, 'null')
            )
    #if ${exclude_tables}
            AND a.table_name NOT IN
            #foreach t in ${exclude_tables} open="(" separator="," close=")"
                :t
            #endfor
    #endif
    #if ${exclude_columns}
            AND a.column_name NOT IN
            #foreach c in ${exclude_columns} open="(" separator="," close=")"
                :c
            #endfor
    #endif

- name: read_schema_different_index
