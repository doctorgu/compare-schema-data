[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compare-schema-data"
version = "1.0.3"
description = "Compare schema and data between databases"
readme = "README_KO.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Gu Park", email = "doctorgu@kakao.com"}
]
keywords = ["compare schema", "database comparison", "schema diff", "mysql", "sqlite"]
dependencies = [
    "sqlite3-client>=1.2.0",
    "mysqlclient-client>=1.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "xlsxwriter>=3.0",
    "tabulate>=0.9",
    "types-tabulate>=0.10",
    "requests>=2.28",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.0",
    "python-dotenv>=1.0.0",
    "ruff"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-mock",
    "pytest-asyncio",
    "build"
]

[project.scripts]
import = "src.main:import_by_args"
compare = "src.main:compare_by_args"

[project.urls]
homepage = "https://github.com/doctorgu/compare-schema-data"
repository = "https://github.com/doctorgu/compare-schema-data"
documentation = "https://github.com/doctorgu/compare-schema-data"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "db_client*"]
namespaces = true

[tool.setuptools.package-data]
"db_client" = [
    "*.yaml",
    "*.yml",
    "*.sql",
    "**/*.yaml",
    "**/*.yml",
    "**/*.sql"
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E", # default style,
    "F", # error (bug)
    "I", # import
    "B", # bugbear
    "UP", # recent python grammar
    # "T20", # No print, Only Logger
]

[tool.ruff.format]
line-ending = "cr-lf"

[tool.pyrefly]
search-path = ["."]